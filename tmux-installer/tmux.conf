## power_mac — behavior shared by every tmux style.
##
## The selected prefix and status-bar palette live in
## ~/.config/tmux/style.conf, which the installer links to either
## tmux-top.conf or tmux-bottom.conf.

#################
##  BEHAVIOR   ##
#################

# Start window and pane numbering at 1, and close numbering gaps automatically.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Use vi keys while selecting and copying text.
setw -g mode-keys vi

# Applications inside tmux must see a tmux terminal, not the outer terminal.
set -g default-terminal "tmux-256color"

# Keep useful scrollback without allowing every pane to grow almost unbounded.
set -g history-limit 100000

# Scroll with the wheel, click panes to focus them, and drag pane borders.
set -g mouse on

# New panes and windows inherit the active pane's working directory.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# Reload this configuration without restarting the tmux server.
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# CPU and RAM information is useful without refreshing every second.
set -g status-interval 5

# Put the session name in the terminal's native title bar too, so it stays
# visible even when the status bar has no room left to show it.
set -g set-titles on
set -g set-titles-string "#S │ #I:#W"

#################
##  PLUGINS    ##
#################

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Save every 15 minutes and restore the latest environment when the tmux server
# starts. Pane scrollback is deliberately not captured.
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# Prefix, status position, and colors. This must be loaded before TPM so plugins
# see the final status-right value. A missing overlay falls back to tmux defaults.
source-file -q ~/.config/tmux/style.conf

# TPM must remain the final command; continuum must remain last in the plugin list.
run '~/.tmux/plugins/tpm/tpm'

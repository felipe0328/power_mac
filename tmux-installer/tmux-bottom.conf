## Bottom style — Ctrl-a prefix, purple palette, status bar at the bottom.

set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g status-position bottom

# Pane borders and messages.
set -g pane-border-style fg='#6272a4'
set -g pane-active-border-style fg='#ff79c6'
set -g message-style bg='#44475a',fg='#8be9fd'
set -g status-style bg='#44475a',fg='#bd93f9'

# SLACK estimates how crowded the window list is: terminal width minus a
# fixed cost per open window. The session name, window labels, and the
# CPU/RAM/clock block all shrink as SLACK drops, so the window list keeps
# its room instead of losing tabs to a fixed-width sidebar.
set -g @slack '#{e|-:#{client_width},#{e|*:#{session_windows},8}}'

# Session name (far-left, never hidden), then the prefix indicator and zoom flag.
set -g status-left-length 40
set -g status-left '#[bg=#6272a4,fg=#f8f8f2] #{?#{e|>=:#{E:@slack},95},#{=/14:session_name},#{?#{e|>=:#{E:@slack},50},#{=/8:session_name},#{=/5:session_name}}} '
set -ga status-left '#[bg=#f8f8f2]#[fg=#282a36]#{?client_prefix,#[bg=#ff79c6],} ☺ '
set -ga status-left '#[bg=#44475a]#[fg=#ff79c6] #{?window_zoomed_flag, ↕ , }'

# Window list. #I is the window number; the name truncates to 4 characters
# once SLACK drops below 65, trading readability for more visible tabs.
setw -g window-status-separator ''
setw -g window-status-style fg='#bd93f9',bg=default
setw -g window-status-current-style fg='#ff79c6',bg='#282a36'
set -g window-status-current-format "#[fg=#44475a]#[bg=#bd93f9]#[fg=#f8f8f2]#[bg=#bd93f9] #I #{?#{e|>=:#{E:@slack},65},#{=/10:window_name},#{=/4:window_name}} #[fg=#bd93f9]#[bg=#44475a]"
set -g window-status-format "#[fg=#44475a]#[bg=#56596a]#[fg=#f8f8f2]#[bg=#56596a] #I #{?#{e|>=:#{E:@slack},65},#{=/10:window_name},#{=/4:window_name}} #[fg=#56596a]#[bg=#44475a]"

# CPU, RAM, time, and date — three tiers that give way as SLACK drops, so
# tabs always win over stats. Below 95 columns (or once tabs crowd it out)
# this segment is empty. tmux-cpu rewrites the literal #{cpu_percentage} and
# #{ram_percentage} tokens below into #(...) shell calls at load time by doing
# a plain text substitution directly on this option's stored value, so those
# tokens must stay inline here rather than hidden behind a @user-option.
# Each #[fg=x]#[bg=y] pair must also stay split rather than combined as
# #[fg=x,bg=y]: a comma inside a #[...] tag breaks the argument split of the
# surrounding #{?cond,yes,no} conditional.
set -g status-right-length 70
set -g status-right '#{?#{&&:#{e|>=:#{client_width},160},#{e|>=:#{E:@slack},115}},#[fg=#8be9fd]#[bg=#44475a]#[fg=#44475a]#[bg=#8be9fd] CPU: 💻 #{cpu_percentage} #[fg=#fdc210]#[bg=#8be9fd]#[fg=#44475a]#[bg=#fdc210] RAM: ⚡#{ram_percentage} #[fg=#bd93f9]#[bg=#fdc210]#[fg=#f8f8f2]#[bg=#bd93f9] %a %I:%M %p  #[fg=#6272a4]%Y-%m-%d ,#{?#{&&:#{e|>=:#{client_width},125},#{e|>=:#{E:@slack},70}},#[fg=#8be9fd]#[bg=#44475a]#[fg=#44475a]#[bg=#8be9fd] CPU: 💻 #{cpu_percentage} #[fg=#fdc210]#[bg=#8be9fd]#[fg=#44475a]#[bg=#fdc210] RAM: ⚡#{ram_percentage} #[fg=#bd93f9]#[bg=#fdc210]#[fg=#f8f8f2]#[bg=#bd93f9] %I:%M %p ,#{?#{&&:#{e|>=:#{client_width},95},#{e|>=:#{E:@slack},25}},#[fg=#bd93f9]#[bg=#44475a]#[fg=#f8f8f2]#[bg=#bd93f9] %I:%M %p ,}}}'

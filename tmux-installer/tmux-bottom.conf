## Bottom style — Ctrl-a prefix, purple palette, status bar at the bottom.

set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g status-position bottom

# Pane borders and messages.
set -g pane-border-style fg='#6272a4'
set -g pane-active-border-style fg='#ff79c6'
set -g message-style bg='#44475a',fg='#8be9fd'
set -g status-style bg='#44475a',fg='#bd93f9'

# Left side and zoom indicator.
set -g status-left '#[bg=#f8f8f2]#[fg=#282a36]#{?client_prefix,#[bg=#ff79c6],} ☺ '
set -ga status-left '#[bg=#44475a]#[fg=#ff79c6] #{?window_zoomed_flag, ↕ , }'

# Window list. #I is the window number and #W is the window name.
setw -g window-status-separator ''
setw -g window-status-style fg='#bd93f9',bg=default
setw -g window-status-current-style fg='#ff79c6',bg='#282a36'
set -g window-status-current-format "#[fg=#44475a]#[bg=#bd93f9]#[fg=#f8f8f2]#[bg=#bd93f9] #I #W #[fg=#bd93f9]#[bg=#44475a]"
set -g window-status-format "#[fg=#44475a]#[bg=#56596a]#[fg=#f8f8f2]#[bg=#56596a] #I #W #[fg=#56596a]#[bg=#44475a]"

# CPU, RAM, time, and date.
set -g status-right-length 70
set -g status-right '#[fg=#8be9fd,bg=#44475a]#[fg=#44475a,bg=#8be9fd] CPU: 💻 #{cpu_percentage} '
set -ga status-right '#[fg=#fdc210,bg=#8be9fd]#[fg=#44475a,bg=#fdc210] RAM: ⚡#{ram_percentage} '
set -ga status-right '#[fg=#bd93f9,bg=#fdc210]#[fg=#f8f8f2,bg=#bd93f9] %a %I:%M %p  #[fg=#6272a4]%Y-%m-%d '
